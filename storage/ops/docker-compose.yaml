services:
  storage:
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: ["app", "data"]
    build:
      context: "{{sdk_root}}/packages/storage/ops"
      dockerfile: "Dockerfile.storage"
    restart: "unless-stopped"
    volumes:
      - "storage-data:/var/lib/storage"
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_KEY}
      POSTGREST_URL: "{{resource_rest_url}}"
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: "postgres://supabase_storage_admin:${STORAGE_ADMIN_PASSWORD}@{{resource_postgres_host}}:{{resource_postgres_port}}/{{resource_postgres_database}}"
      FILE_SIZE_LIMIT: "{{setting_storage_max_object_bytes}}"
      STORAGE_BACKEND: "${STORAGE_BACKEND:-file}"
      FILE_STORAGE_BACKEND_PATH: "/var/lib/storage"
      GLOBAL_S3_BUCKET: "${S3_BUCKET:-stub}"
      GLOBAL_S3_ENDPOINT: "${S3_ENDPOINT:-}"
      GLOBAL_S3_PROTOCOL: "https"
      GLOBAL_S3_FORCE_PATH_STYLE: "true"
      AWS_DEFAULT_REGION: "${S3_REGION:-}"
      AWS_ACCESS_KEY_ID: "${S3_ACCESS_KEY:-}"
      AWS_SECRET_ACCESS_KEY: "${S3_SECRET_KEY:-}"
      TENANT_ID: "stub"
      ENABLE_IMAGE_TRANSFORMATION: "{{setting_storage_image_transformation}}"
      IMGPROXY_URL: "http://imgproxy:5001"
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:5000/status",
        ]
      interval: "5s"
      timeout: "5s"
      retries: 3
      start_period: "60s"
    depends_on:
      provision:
        condition: "service_completed_successfully"
      rest:
        condition: "service_started"
      imgproxy:
        condition: "service_started"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  storage-init:
    networks: ["data"]
    image: "postgres:15.19-alpine"
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - "{{sdk_root}}/packages/storage/db/init/storage.sql:/storage-init.sql:ro,Z"
    command:
      [
        "psql",
        "-v",
        "ON_ERROR_STOP=1",
        "-h",
        "{{resource_postgres_host}}",
        "-U",
        "postgres",
        "-d",
        "postgres",
        "-f",
        "/storage-init.sql",
      ]
    depends_on:
      storage:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
  imgproxy:
    networks: ["app"]
    image: "darthsim/imgproxy:v3.30.1"
    restart: "unless-stopped"
    volumes:
      - "storage-data:/var/lib/storage:ro"
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: "/"
      IMGPROXY_USE_S3: "${IMGPROXY_USE_S3:-false}"
      IMGPROXY_S3_ENDPOINT: "${S3_ENDPOINT:-}"
      IMGPROXY_S3_REGION: "${S3_REGION:-}"
      AWS_ACCESS_KEY_ID: "${S3_ACCESS_KEY:-}"
      AWS_SECRET_ACCESS_KEY: "${S3_SECRET_KEY:-}"
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_AUTO_WEBP: "true"
      IMGPROXY_MAX_SRC_RESOLUTION: "16.8"
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: "5s"
      timeout: "5s"
      retries: 3
      start_period: "20s"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  storage-data: null
