syntax = "proto3";

package scribe.clients.storage.v1;

import "scribe/protocol/common.proto";

message ObjectRef {
  string folder = 1;
  map<string, string> path_args = 2;
  string filename = 3;
}

message UploadRequest {
  ObjectRef object = 1;
  bytes content = 2;
  string mime_type = 3;
  bool upsert = 4;
}

message UploadResult {
  string path = 1;
  scribe.v1.Size size = 2;
  scribe.v1.Failure error = 3;
}

message DeleteRequest {
  repeated ObjectRef objects = 1;
}

message DeleteResult {
  uint32 deleted = 1;
  scribe.v1.Failure error = 2;
}

message SignedUrlRequest {
  ObjectRef object = 1;
  scribe.v1.Time expires_in = 2;
}

message SignedUrlResult {
  string url = 1;
  scribe.v1.Failure error = 2;
}

message ListRequest {
  string folder = 1;
  map<string, string> path_args = 2;
  uint32 limit = 3;
  uint32 offset = 4;
}

message ObjectSummary {
  string path = 1;
  scribe.v1.Size size = 2;
  string mime_type = 3;
  int64 updated_at = 4;
}

message ListResult {
  repeated ObjectSummary objects = 1;
  scribe.v1.Failure error = 2;
}

service Storage {
  rpc Upload(UploadRequest) returns (UploadResult);
  rpc Delete(DeleteRequest) returns (DeleteResult);
  rpc SignedUrl(SignedUrlRequest) returns (SignedUrlResult);
  rpc List(ListRequest) returns (ListResult);
}
