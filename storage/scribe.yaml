name: storage
title: Objects, buckets and image derivatives.
optional: true

requires: []

ops:
  services:
    - storage
    - storage-init
    - imgproxy
  profile: null
  gateway:
    - storage-v1
  env:
    - STORAGE_BACKEND
    - S3_BUCKET
    - S3_ENDPOINT
    - S3_REGION
    - S3_ACCESS_KEY
    - S3_SECRET_KEY
    - IMGPROXY_USE_S3

sql: db/init
protocol: protocol/storage.proto
export: "@scribe/storage"

routes: []
