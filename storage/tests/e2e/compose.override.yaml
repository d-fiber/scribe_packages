name: scribe-storage-e2e

services:
  db:
    volumes:
      - "./.postgres:/var/lib/postgresql/data:Z"
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        "-c",
        "log_min_messages=fatal",
        "-c",
        "max_connections=100",
        "-c",
        "shared_buffers=256MB",
        "-c",
        "effective_cache_size=1GB",
      ]

  rest:
    ports: ["3000"]

  storage:
    ports: ["5000"]
    volumes:
      - "storage-data:/var/lib/storage"

  imgproxy:
    volumes:
      - "storage-data:/var/lib/storage"

volumes:
  db-config: null
  storage-data: null
