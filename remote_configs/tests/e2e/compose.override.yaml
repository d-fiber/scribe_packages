name: scribe-remote-configs-e2e

services:
  db:
    volumes:
      - "./.postgres:/var/lib/postgresql/data:Z"
      - "./db/skipped_features:/docker-entrypoint-init-sql/framework/04_features:ro"
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        "-c",
        "log_min_messages=fatal",
        "-c",
        "max_connections=100",
        "-c",
        "shared_buffers=256MB",
        "-c",
        "effective_cache_size=1GB",
      ]

  rest:
    ports: ["3000"]

  redis:
    ports: ["6379"]

volumes:
  db-config: null
