name: scribe-foundation-e2e
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: e2epass
      POSTGRES_DB: postgres
    ports: ["55432:5432"]
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  rest:
    build:
      context: ../ops/database
      dockerfile: Dockerfile.rest
    environment:
      PGRST_DB_URI: "postgres://authenticator:e2epass@db:5432/postgres"
      PGRST_DB_SCHEMAS: "public"
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_EXTRA_SEARCH_PATH: "public"
      PGRST_DB_ANON_ROLE: "anon"
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_DB_POOL: "40"
      PGRST_JWT_SECRET: "e2e-jwt-secret-long-enough-for-hs256-signing"
      PGRST_SERVER_PORT: "3000"
    ports: ["53000:3000"]
    depends_on:
      db: { condition: service_healthy }

  redis:
    image: valkey/valkey:8.1-alpine
    command:
      [
        "valkey-server",
        "--requirepass",
        "e2epass",
        "--appendonly",
        "yes",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "volatile-lru",
      ]
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "e2epass", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2-alpine
    command: ["-js", "-sd", "/data", "-m", "8222", "--auth", "e2epass"]
    ports: ["54222:4222", "58222:8222"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 10
