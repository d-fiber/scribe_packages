syntax = "proto3";

package scribe.runtime.queue.v1;

import "scribe/protocol/common.proto";

message Message {
  string message_id = 1;
  scribe.v1.Json payload = 2;
  uint32 attempt = 3;
  int64 enqueued_at = 4;
}

message PushRequest {
  string queue_id = 1;
  repeated scribe.v1.Json payloads = 2;
  scribe.v1.Time delay = 3;
}

message PushResult {
  repeated string message_ids = 1;
  scribe.v1.Failure error = 2;
}

message Batch {
  string queue_id = 1;
  string trace_id = 2;
  repeated Message messages = 3;
  string capability_token = 4;
}

message MessageOutcome {
  string message_id = 1;
  bool acknowledged = 2;
  scribe.v1.Failure error = 3;
}

message BatchOutcome {
  repeated MessageOutcome outcomes = 1;
}

service Queue {
  rpc Push(PushRequest) returns (PushResult);
}

service QueueDispatch {
  rpc Handle(Batch) returns (BatchOutcome);
}
