syntax = "proto3";

package scribe.runtime.hook.v1;

import "scribe/protocol/common.proto";

message Event {
  string hook_id = 1;
  string event = 2;
  string trace_id = 3;
  scribe.v1.Json payload = 4;
  int64 emitted_at = 5;
  string capability_token = 6;
}

message EmitResult {
  uint32 handled = 1;
  scribe.v1.Failure error = 2;
}

message HandleResult {
  bool halted = 1;
  scribe.v1.Json mutation = 2;
  scribe.v1.Failure error = 3;
}

service Hook {
  rpc Emit(Event) returns (EmitResult);
}

service HookDispatch {
  rpc Handle(Event) returns (HandleResult);
}
