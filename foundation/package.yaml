name: foundation
description: The engine every other package reaches, from the rows and the cache to the queue, the cron and the quota.
version: 1.0.0

environment:
  scribe: "^1.0.0"

dependencies:
  "@scribe/contracts/": any
  "@nats-io/jetstream": any
  "@nats-io/transport-deno": any
  "@scribe/runtime/": any
  "@supabase/postgrest-js": any
  croner: any
  ioredis: any

dev_dependencies:
  "@std/testing/mock": any
  "@std/testing/time": any

scribe:
  db:
    init: ./db/init/
    provisioning: ./db/provisioning/
  protocol: ./protocol/
  ops:
    - ./ops/database/
    - ./ops/queue/
    - ./ops/valkery/
  declarations:
    queues: Queue
    crons: Cron
