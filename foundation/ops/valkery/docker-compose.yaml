services:
  redis:
    container_name: "redis"
    image: "valkey/valkey:8.1-alpine"
    restart: "unless-stopped"
    volumes:
      - "redis-data:/data"
    command:
      [
        "valkey-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--appendonly",
        "yes",
        "--maxmemory",
        "1gb",
        "--maxmemory-policy",
        "volatile-lru",
      ]
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: "5s"
      timeout: "5s"
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  redis-data: null
