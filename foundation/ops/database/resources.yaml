services:
  rest:
    cpu_shares: {{rest_cpu_shares}}
    deploy:
      resources:
        limits:
          memory: "{{rest_mem_limit}}"
        reservations:
          memory: "{{rest_mem_res}}"

  db:
    cpu_shares: 4096
    deploy:
      resources:
        limits:
          memory: "{{db_mem_limit}}"
        reservations:
          memory: "{{db_mem_res}}"

  db-migrate:
    deploy:
      resources:
        limits:
          memory: "{{db_migrate_mem_limit}}"
