services:
  rest:
    build:
      context: "{{sdk_root}}/packages/foundation/ops/database"
      dockerfile: "Dockerfile.rest"
    restart: "unless-stopped"
    environment:
      PGRST_DB_URI: "postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres"
      PGRST_DB_SCHEMAS: "public"
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_EXTRA_SEARCH_PATH: "public"
      PGRST_DB_ANON_ROLE: "anon"
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_DB_POOL: "40"
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: "3600"
    command: ["postgrest"]
    depends_on:
      db:
        condition: "service_healthy"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    container_name: "db"
    build:
      context: "{{sdk_root}}"
      dockerfile: "packages/foundation/ops/database/Dockerfile"
    restart: "unless-stopped"
    volumes:
      - "{{sdk_root}}/packages/foundation/db/provisioning/_supabase.sql:/docker-entrypoint-initdb.d/init-scripts/97-_supabase.sql:Z"
      - "{{sdk_root}}/provisioning/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:Z"
      - "{{sdk_root}}/provisioning/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z"
      - "{{sdk_root}}/provisioning/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z"
      - "{{sdk_root}}/packages/foundation/db/init:/docker-entrypoint-init-sql/foundation:ro"
      - "${PROJECT_DB_INIT:-./lib/db/init}:/docker-entrypoint-init-sql/project:ro"
      - "{{sdk_root}}/packages/foundation/ops/database/run-init-scripts.sh:/docker-entrypoint-initdb.d/zz-run-init-scripts.sh:Z"
      - "{{sdk_root}}/postgres:/var/lib/postgresql/data:Z"
      - "db-config:/etc/postgresql-custom"
    environment:
      POSTGRES_HOST: "/var/run/postgresql"
      SMTP_ENCRYPTION_KEY: "${SMTP_ENCRYPTION_KEY}"
      API_INTERNAL_URL: "${API_INTERNAL_URL:-http://api:3000}"
      FUNCTIONS_INTERNAL_URL: "${FUNCTIONS_INTERNAL_URL:-http://functions:9000}"
      PGBACKREST_STANZA: "{{app_name_snake}}"
      PGBACKREST_PG1_PATH: "/var/lib/postgresql/data"
      PGBACKREST_REPO1_TYPE: "${PGBACKREST_REPO_TYPE:-none}"
      PGBACKREST_REPO1_PATH: "/pgbackrest"
      PGBACKREST_REPO1_S3_BUCKET: "${PGBACKREST_BUCKET:-}"
      PGBACKREST_REPO1_S3_ENDPOINT: "${PGBACKREST_ENDPOINT:-}"
      PGBACKREST_REPO1_S3_REGION: "${PGBACKREST_REGION:-}"
      PGBACKREST_REPO1_S3_KEY: "${PGBACKREST_KEY:-}"
      PGBACKREST_REPO1_S3_KEY_SECRET: "${PGBACKREST_KEY_SECRET:-}"
      PGBACKREST_REPO1_S3_URI_STYLE: "path"
      PGBACKREST_REPO1_RETENTION_FULL: "2"
      PGBACKREST_COMPRESS_TYPE: "zst"
      PGBACKREST_COMPRESS_LEVEL: "3"
      PGBACKREST_PROCESS_MAX: "4"
      PGBACKREST_ARCHIVE_ASYNC: "y"
      PGBACKREST_SPOOL_PATH: "/var/spool/pgbackrest"
      PGBACKREST_LOG_PATH: "/var/log/pgbackrest"
      PGBACKREST_START_FAST: "y"
      PGBACKREST_DELTA: "y"
      PGPORT: "5432"
      POSTGRES_PORT: "5432"
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: "postgres"
      POSTGRES_DB: "postgres"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: "3600"
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        "-c",
        "log_min_messages=fatal",
        "-c",
        "max_connections=300",
        "-c",
        "shared_buffers=4GB",
        "-c",
        "effective_cache_size=12GB",
      ]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: "5s"
      timeout: "5s"
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db-migrate:
    container_name: "db-migrate"
    image: "ghcr.io/amacneil/dbmate:2"
    restart: "no"
    environment:
      DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres?sslmode=disable"
    volumes:
      - "${PROJECT_DB_MIGRATIONS:-./lib/db/migrations}:/db/migrations/project:ro"
      - "{{sdk_root}}/packages/foundation/ops/database/run-migrations.sh:/run-migrations.sh:ro"
    entrypoint: ["/bin/sh", "/run-migrations.sh"]
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
