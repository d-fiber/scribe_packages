name: promote

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: promotion
    steps:
      - name: Check who asked
        env:
          ASKED_BY: ${{ github.actor }}
          OWNER: ${{ vars.PROMOTER || 'daf-ep' }}
        run: |
          set -eu
          if [ "$ASKED_BY" != "$OWNER" ]; then
            echo "$ASKED_BY asked to promote, and only $OWNER decides that. Nothing was moved." >&2
            exit 1
          fi
          echo "asked by $ASKED_BY"

      - name: Check that the key this needs is here
        env:
          KEY: ${{ secrets.PROMOTE_PUSH_KEY }}
        run: |
          set -eu
          [ -n "$KEY" ] && exit 0

          echo "PROMOTE_PUSH_KEY is not set on this repository, and nothing can move without it." >&2
          echo "" >&2
          echo "It is the private half of the deploy key named \"packages promote\", which the" >&2
          echo "ruleset lets through to main. Without it the push is refused like anybody else's." >&2
          echo "" >&2
          echo "Nothing was moved." >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
          ssh-key: ${{ secrets.PROMOTE_PUSH_KEY }}

      - name: Check that every package is named at the version its manifest holds
        run: |
          set -eu
          missing=""

          for manifest in */package.yaml; do
            package=$(dirname "$manifest")
            version=$(awk '/^version:/ { print $2; exit }' "$manifest")

            if git rev-parse "$package-v$version" >/dev/null 2>&1; then
              echo "$package is $version, named"
              continue
            fi

            missing="$missing $package-v$version"
          done

          [ -z "$missing" ] && exit 0

          echo "" >&2
          echo "These tags do not exist, so the CI has never been green on those versions:" >&2
          for tag in $missing; do echo "  $tag" >&2; done
          echo "" >&2
          echo "Run release first, so each version is written and named. Nothing was moved." >&2
          exit 1

      - name: Put dev on main
        run: |
          set -eu
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            git checkout main
            git merge --no-ff origin/dev -m "Merge dev into main"
          else
            echo "main does not exist yet, so this promotion is what creates it"
            git checkout -b main
          fi

          git push origin main

      - name: Point dev back at main
        run: |
          set -eu
          if git push origin HEAD:dev; then
            exit 0
          fi

          echo "main now holds these packages, but dev could not be moved onto it." >&2
          echo "" >&2
          echo "Something reached dev while this promotion was running, so dev is no longer" >&2
          echo "an ancestor of what main holds. Nothing is lost and nothing was published:" >&2
          echo "settle dev, then run promote again. The merge, the push and the releases all" >&2
          echo "redo themselves without doubling anything." >&2
          exit 1

      - name: Write one release per package that has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          written=0

          for manifest in */package.yaml; do
            package=$(dirname "$manifest")
            version=$(awk '/^version:/ { print $2; exit }' "$manifest")
            tag="$package-v$version"

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag is already released"
              continue
            fi

            bash .github/version/notes.sh "$package" > /tmp/notes.md
            gh release create "$tag" \
              --title "$package $version" \
              --notes-file /tmp/notes.md \
              --verify-tag
            written=$((written + 1))
          done

          echo ""
          echo "$written package(s) released. The others were already out at the version they hold."
