name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DENO_VERSION: 2.7.14
  DART_SDK: 3.12.2

jobs:
  # The three checks every repository owes, held once in the framework.
  checks:
    uses: d-fiber/scribe/.github/workflows/gate.yml@7cd6af853c86cdd9d06470d82eea9db049b65516
    with:
      excluded: "node_modules .git .dart_tool __pycache__ gen examples templates fixtures .e2e"

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: source

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: d-fiber/scribe
          ref: dev
          path: scribe

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: d-fiber/scribe_tools
          ref: dev
          path: scribe_tools

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ env.DART_SDK }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('scribe/deno.lock') }}
          restore-keys: deno-${{ runner.os }}-

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('scribe_tools/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Resolve scribe_tools' own dependencies
        working-directory: scribe_tools
        run: dart pub get

      - name: Refuse a package whose lock is behind its manifest
        env:
          SCRIBE_ROOT: ${{ github.workspace }}/scribe
        run: |
          set -eu
          for manifest in source/*/package.yaml; do
            (cd "$(dirname "$manifest")" && dart run "$GITHUB_WORKSPACE/scribe_tools/bin/scribe.dart" forge)
          done
          git -C source diff --exit-code -- '*/package.lock'

      - name: Put these packages in the framework
        run: bash source/.github/sync/copy.sh "$GITHUB_WORKSPACE/scribe/packages"

      - name: Write deno.json from scribe.workspace.json
        working-directory: scribe
        run: bash dev_tools/gen/workspace.sh

      - name: Type check, lint and run the suite with them
        working-directory: scribe
        run: |
          set -eu
          deno task check
          deno task lint
          deno task test

  # The only job that writes, and it waits for every job that judges.
  #
  # A tag never moves, so one posted while a check was still running would name a
  # red commit for good. The changelog goes out on this repository's own write
  # key rather than on GITHUB_TOKEN, because a push made with that token starts
  # no workflow and the commit would land on dev without anything reading it.
  tag:
    needs: [verify, checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.PROMOTE_PUSH_KEY }}
          persist-credentials: true

      - name: Write what each version that moved is made of
        run: |
          set -eu
          # One section per package, because a version here belongs to a package
          # and not to the repository. A package whose version has not moved is
          # told so by the script and writes nothing.
          for manifest in */package.yaml; do
            bash .github/version/changelog.sh "$(dirname "$manifest")"
          done

          git diff --quiet && exit 0

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ./*/CHANGELOG.md
          git commit -m "[DOC]: write what the versions that moved are made of"
          git push origin HEAD:dev

      - name: Name this commit after every version that moved
        run: bash .github/version/tag.sh
