name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headers:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check license headers
        run: bash .github/headers/check.sh
