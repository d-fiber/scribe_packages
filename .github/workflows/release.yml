name: release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0

      - name: Check that every version its manifest holds is free
        run: bash .github/version/check.sh

      - name: Write what each version is made of
        run: |
          set -eu
          for manifest in */package.yaml; do
            bash .github/version/changelog.sh "$(dirname "$manifest")"
          done

          git diff --quiet -- '*/CHANGELOG.md' && exit 0

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*/CHANGELOG.md'
          git commit -m "[DOC]: write what these versions are made of"
          git push origin HEAD:dev

      - name: Name this commit after each version
        run: bash .github/version/tag.sh
