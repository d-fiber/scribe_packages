services:
  realtime:
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "SETGID", "SETUID"]
    profiles: ["realtime"]
    image: "supabase/realtime:v2.76.5"
    restart: "unless-stopped"
    environment:
      PORT: "4000"
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_USER: "supabase_admin"
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: "postgres"
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: ${DB_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      ERL_AFLAGS: "-proto_dist inet_tcp"
      DNS_NODES: "''"
      RLIMIT_NOFILE: "4096"
      APP_NAME: "realtime"
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"
      MAX_CONNECTIONS: "100"
      NUM_ACCEPTORS: "10"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -sSfL --head -o /dev/null -H "Authorization: Bearer ${ANON_KEY}" http://127.0.0.1:4000/api/tenants/realtime-dev/health',
        ]
      interval: "30s"
      timeout: "5s"
      retries: 3
      start_period: "60s"
    depends_on:
      db:
        condition: "service_healthy"
    networks:
      data: null
      app:
        aliases:
          - realtime-dev.supabase-realtime
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  realtime-init:
    networks: ["data"]
    profiles: ["realtime"]
    image: "postgres:15.19-alpine"
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - "{{sdk_root}}/packages/realtime/db/init/realtime.sql:/realtime-init.sql:ro,Z"
      - "${PROJECT_DB_INIT:-./lib/db/init}:/project-db-init:ro,Z"
    command:
      [
        "sh",
        "-c",
        "psql -v ON_ERROR_STOP=1 -h db -U postgres -d postgres -f /realtime-init.sql && if [ -f /project-db-init/realtime.sql ]; then psql -v ON_ERROR_STOP=1 -h db -U postgres -d postgres -f /project-db-init/realtime.sql; fi",
      ]
    depends_on:
      realtime:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
