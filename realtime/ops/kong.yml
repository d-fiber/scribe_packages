services:
  - name: realtime-v1-ws
    url: http://realtime-dev.supabase-realtime:4000/socket
    protocol: ws
    routes:
      - name: realtime-v1-ws
        strip_path: true
        paths:
          - /realtime/v1/
    plugins:
      - name: cors
        config:
          {{realtime_cors_origins}}
      - name: pre-function
        config:
          access:
            - |
                local apikey = kong.request.get_query_arg("apikey")
                local access_token = kong.request.get_query_arg("access_token")

                if not apikey then
                  return kong.response.exit(401, '{"message":"Unauthorized"}', {["Content-Type"] = "application/json"})
                end

                if not access_token then
                  -- Legacy path: static project key only.
                  local is_static_key = apikey == "$ANON_KEY"
                    or apikey == "$PUBLISHABLE_KEY"
                    or apikey == "$SERVICE_KEY"
                    or apikey == "$SECRET_KEY"

                  if not is_static_key then
                    return kong.response.exit(401, '{"message":"Unauthorized"}', {["Content-Type"] = "application/json"})
                  end
                  return
                end

                local parts = 0
                for _ in access_token:gmatch("[^.]+") do parts = parts + 1 end
                if parts ~= 3 then
                  return kong.response.exit(401, '{"message":"Unauthorized"}', {["Content-Type"] = "application/json"})
                end

                local payload_b64 = access_token:match("^[^.]+%.([^.]+)%.")
                if not payload_b64 then
                  return kong.response.exit(401, '{"message":"Unauthorized"}', {["Content-Type"] = "application/json"})
                end

                local b64 = payload_b64:gsub('%-', '+'):gsub('_', '/')
                local pad = (4 - #b64 % 4) % 4
                b64 = b64 .. string.rep('=', pad)
                local decoded = ngx.decode_base64(b64)
                if not decoded then
                  return kong.response.exit(401, '{"message":"Unauthorized"}', {["Content-Type"] = "application/json"})
                end

                local app_meta = decoded:match('"app_metadata"%s*:%s*{(.-)}')
                local role = app_meta and app_meta:match('"role"%s*:%s*"([^"]*)"')
                local is_admin = role == "admin"

                local key_list = is_admin and "$ADMIN_KEYS" or "$APP_KEYS"
                local is_valid_app_key = false
                for key in key_list:gmatch("[^,]+") do
                  if apikey == key then
                    is_valid_app_key = true
                    break
                  end
                end

                if not is_valid_app_key then
                  return kong.response.exit(401, '{"message":"Unauthorized"}', {["Content-Type"] = "application/json"})
                end

                local query = kong.request.get_query()
                query.apikey = "$ANON_KEY"
                kong.service.request.set_query(query)
      - name: request-transformer
        config:
          add:
            headers:
              - "x-api-key:$LUA_RT_WS_EXPR"
          replace:
            querystring:
              - "apikey:$LUA_RT_WS_EXPR"

  - name: realtime-v1-rest
    url: http://realtime-dev.supabase-realtime:4000/api
    protocol: http
    routes:
      - name: realtime-v1-rest
        strip_path: true
        paths:
          - /realtime/v1/api
    plugins:
      - name: request-termination
        config:
          status_code: 404
          message: "Not found"
