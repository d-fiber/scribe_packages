name: scribe-realtime-e2e

services:
  db:
    volumes:
      - "../../realtime/deploy/db/provisioning/realtime.sql:/docker-entrypoint-initdb.d/init-scripts/96-realtime.sql:Z"
      - "./.postgres:/var/lib/postgresql/data:Z"
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        "-c",
        "log_min_messages=fatal",
        "-c",
        "max_connections=100",
        "-c",
        "shared_buffers=256MB",
        "-c",
        "effective_cache_size=1GB",
      ]

  rest:
    ports: ["3000"]

  realtime:
    ports: ["4000"]

  realtime-init:
    volumes:
      - "../deploy/db/init/realtime.sql:/realtime-init-project.sql:ro,Z"

volumes:
  db-config: null
